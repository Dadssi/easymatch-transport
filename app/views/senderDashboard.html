<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 transition-all duration-300 hover:shadow-xl">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Package Dashboard</h1>
            
            <!-- Stats Section -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="bg-blue-50 p-4 rounded-lg transform hover:scale-105 transition-transform duration-300">
                    <h3 class="text-lg font-semibold text-blue-700">Total Packages</h3>
                    <p class="text-2xl font-bold text-blue-800" id="totalPackages">0</p>
                </div>
                <div class="bg-yellow-50 p-4 rounded-lg transform hover:scale-105 transition-transform duration-300">
                    <h3 class="text-lg font-semibold text-yellow-700">Pending</h3>
                    <p class="text-2xl font-bold text-yellow-800" id="pendingPackages">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-lg transform hover:scale-105 transition-transform duration-300">
                    <h3 class="text-lg font-semibold text-green-700">Delivered</h3>
                    <p class="text-2xl font-bold text-green-800" id="deliveredPackages">0</p>
                </div>
            </div>

            <!-- Packages List -->
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Request ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Package Size</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Route</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="packagesList" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Driver Info Popup -->
    <div id="driverPopup" class="hidden fixed bg-white p-4 rounded-lg shadow-xl border border-gray-200 z-50 transition-all duration-300 transform scale-0">
        <h3 class="text-lg font-semibold mb-2">Driver Information</h3>
        <div id="driverInfo"></div>
    </div>

    <script>
        let packages = [];
        let drivers = [];

        // Fetch packages and drivers data
        async function fetchData() {
            try {
                // Fetch packages
                const packagesResponse = await fetch('/sender/maderequestes');
                packages = await packagesResponse.json();

                // Fetch drivers
                const driversResponse = await fetch('/user/getalldrivers');
                drivers = await driversResponse.json();

                updateStats();
                renderPackages();
            } catch (error) {
                console.error('Error fetching data:', error);
                showNotification('Error loading data', 'error');
            }
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalPackages').textContent = packages.length;
            document.getElementById('pendingPackages').textContent = packages.filter(p => p.status === 'pending').length;
            document.getElementById('deliveredPackages').textContent = packages.filter(p => p.status === 'delivered').length;
        }

        // Render packages list
        function renderPackages() {
            const packagesList = document.getElementById('packagesList');
            packagesList.innerHTML = '';

            packages.forEach(pkg => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors duration-200';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">#${pkg.request_id}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${pkg.package_size} kg</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${pkg.pickup_city} → ${pkg.dropoff_city}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${moment(pkg.created_at).format('MMM DD, YYYY')}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                            ${pkg.status === 'pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'}">
                            ${pkg.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        ${pkg.status === 'pending' ? 
                            `<button onclick="cancelPackage(${pkg.request_id})" 
                                class="text-red-600 hover:text-red-900 transition-colors duration-200">
                                Cancel
                            </button>` : 
                            '<span class="text-gray-400">Delivered</span>'
                        }
                    </td>
                `;

                // Add driver info hover functionality
                row.addEventListener('mouseenter', (e) => {
                    const driver = drivers.find(d => d.user_id === pkg.announcement_id);
                    if (driver) {
                        showDriverInfo(e, driver);
                    }
                });
                row.addEventListener('mouseleave', hideDriverInfo);
                packagesList.appendChild(row);
            });
        }

        // Show driver info popup
        function showDriverInfo(event, driver) {
            const popup = document.getElementById('driverPopup');
            const driverInfo = document.getElementById('driverInfo');
            
            driverInfo.innerHTML = `
                <p class="text-sm text-gray-600">Name: ${driver.first_name} ${driver.last_name}</p>
                <p class="text-sm text-gray-600">Email: ${driver.email}</p>
                <p class="text-sm text-gray-600">Status: ${driver.isverified ? 'Verified' : 'Unverified'}</p>
            `;

            popup.style.display = 'block';
            popup.style.transform = 'scale(1)';
            
            const x = event.clientX + 10;
            const y = event.clientY + 10;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;

            popup.addEventListener('mouseenter', () => {
                popup.style.display = 'block';
                popup.style.transform = 'scale(1)';
            });

            popup.addEventListener('mouseleave', hideDriverInfo);
        }

        // Hide driver info popup
        function hideDriverInfo() {
            const popup = document.getElementById('driverPopup');
            popup.style.transform = 'scale(0)';
            setTimeout(() => {
                if (popup.style.transform === 'scale(0)') {
                    popup.style.display = 'none';
                }
            }, 300);
        }

        // Cancel package
        async function cancelPackage(packageId) {
            try {
                const response = await fetch('/sender/changePackageStatus', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        package_id: packageId,
                        status: 'cancelled'
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to cancel package');
                }

                // Refresh data after cancellation
                await fetchData();
                showNotification(`Package #${packageId} cancelled successfully`, 'success');
            } catch (error) {
                console.error('Error cancelling package:', error);
                showNotification('Error cancelling package', 'error');
            }
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed bottom-4 right-4 px-4 py-3 rounded ${
                type === 'success' ? 'bg-green-100 border-green-400 text-green-700' :
                'bg-red-100 border-red-400 text-red-700'
            }`;
            notification.innerHTML = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();

            // Add global mouseout handler
            document.addEventListener('mouseout', (e) => {
                const popup = document.getElementById('driverPopup');
                const relatedTarget = e.relatedTarget || e.toElement;
                
                if (!relatedTarget || relatedTarget.nodeName === "HTML") {
                    hideDriverInfo();
                }
            });
        });
    </script>
</body>
</html>
