<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Dashboard Conducteur - EasyMatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.2.7/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 500px; width: 100%; margin-top: 20px; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <!-- Header -->
    <h1 class="text-3xl font-bold mb-4">Dashboard Conducteur</h1>

    <!-- Profile Section -->
    <div id="profile" class="bg-white p-4 rounded shadow mb-4">
      <h2 class="text-xl font-semibold mb-2">Mon Profil</h2>
      <div id="profileInfo">Chargement du profil...</div>
    </div>

    <!-- Vehicle Section -->
    <div id="vehicleSection" class="bg-white p-4 rounded shadow mb-4">
      <h2 class="text-xl font-semibold mb-2">Mon Véhicule</h2>
      <div id="vehicleInfo">Chargement du véhicule...</div>
      <button id="addVehicleBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Ajouter Véhicule</button>
    </div>

    <!-- Add Vehicle Modal -->
    <div id="addVehicleModal" style="display:none;">
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-4 rounded shadow-lg">
          <h2 class="text-xl font-semibold mb-2">Ajouter Véhicule</h2>
          <form id="addVehicleForm">
            <label for="vehicle_type" class="block mb-1 font-medium">Type de Véhicule</label>
            <select id="vehicle_type" name="vehicle_type">
              <option value="Truck">Camion</option>
              <option value="car">Voiture</option>
              <option value="Van">Moto</option>
            </select>
            <label for="carry_size" class="block mb-1 font-medium">Taille de Transport</label>
            <input type="number" id="carry_size" name="carry_size" class="w-full border border-gray-300 rounded p-2 mb-4" required>
            <div class="flex justify-end space-x-2">
              <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Ajouter</button>
              <button type="button" id="cancelAddVehicle" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Form & Map Section -->
    <div class="bg-white p-4 rounded shadow mb-4">
      <h2 class="text-xl font-semibold mb-2">Créer une Annonce & Planifier l'Itinéraire</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Form Inputs -->
        <div>
          <div class="mb-4">
            <label for="start" class="block mb-1 font-medium">Point de départ</label>
            <select id="start" class="w-full border border-gray-300 rounded p-2">
              <option value="">Sélectionner la ville de départ</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="end" class="block mb-1 font-medium">Point d'arrivée</label>
            <select id="end" class="w-full border border-gray-300 rounded p-2">
              <option value="">Sélectionner la ville d'arrivée</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="block mb-1 font-medium">Villes intermédiaires</label>
            <div id="waypoints" class="flex flex-wrap gap-2"></div>
            <button id="addWaypointBtn" class="bg-gray-200 text-gray-800 px-3 py-1 rounded hover:bg-gray-300">Ajouter une ville intermédiaire</button>
          </div>
          <div class="mb-4">
            <label for="availableFrom" class="block mb-1 font-medium">Disponible à partir de</label>
            <input type="datetime-local" id="availableFrom" class="w-full border border-gray-300 rounded p-2">
          </div>
          <div class="mb-4">
            <label for="availableUntil" class="block mb-1 font-medium">Disponible jusqu'à</label>
            <input type="datetime-local" id="availableUntil" class="w-full border border-gray-300 rounded p-2">
          </div>
          <div class="flex space-x-2">
            <button id="createAnnouncementBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Créer l'annonce</button>
          </div>
        </div>
        <!-- Map Preview -->
        <div>
          <div id="map"></div>
        </div>
      </div>
    </div>

    <!-- Announcements List Section -->
    <div class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-2">Mes Annonces</h2>
      <div id="announcementsList">Aucune annonce chargée.</div>
    </div>

    <div class="bg-white p-4 rounded shadow mt-4">
      <h2 class="text-xl font-semibold mb-2">Colis Associés</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-2">ID Colis</th>
              <th class="px-4 py-2">Expéditeur</th>
              <th class="px-4 py-2">Taille</th>
              <th class="px-4 py-2">Départ</th>
              <th class="px-4 py-2">Destination</th>
              <th class="px-4 py-2">Statut</th>
              <th class="px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="packagesTableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  
  <script>
    let driverProfile = null;
    let cities = [];
    let driverVehicleId = null; 
    const JSON_PATH = '/user/cities';
    let map, routeLayer;
  
    function initMap() {
      map = L.map('map').setView([31.7917, -7.0926], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    }
  
    async function loadCities() {
      try {
        const response = await fetch(JSON_PATH);
        const data = await response.json();
        cities = data.cities;
        populateCitySelects();
      } catch (error) {
        console.error("Erreur lors du chargement des villes:", error);
        alert("Erreur lors du chargement des villes.");
      }
    }
  
    function getUniqueCities() {
      const unique = {};
      cities.forEach(city => {
        if (!unique[city.city]) unique[city.city] = city;
      });
      return Object.values(unique).sort((a, b) => a.city.localeCompare(b.city));
    }
  
    function populateCitySelects() {
      const uniqueCities = getUniqueCities();
      const selects = [document.getElementById('start'), document.getElementById('end')];
      selects.forEach(select => {
        if (select.options.length <= 1) {
          uniqueCities.forEach(city => {
            const option = document.createElement('option');
            option.value = city.city;
            option.textContent = city.city;
            select.appendChild(option);
          });
        }
        select.addEventListener('change', updateMap);
      });
    }
  
    function addWaypoint() {
      const waypointsDiv = document.getElementById('waypoints');
      const container = document.createElement('div');
      container.className = 'flex items-center space-x-2 mb-2';
      const select = document.createElement('select');
      select.className = 'border border-gray-300 rounded p-2';
      select.innerHTML = '<option value="">Ville intermédiaire</option>';
      getUniqueCities().forEach(city => {
        const option = document.createElement('option');
        option.value = city.city;
        option.textContent = city.city;
        select.appendChild(option);
      });
      select.addEventListener('change', updateMap);
      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'X';
      removeBtn.className = 'bg-red-500 text-white px-2 py-1 rounded ml-2';
      removeBtn.addEventListener('click', () => {
        waypointsDiv.removeChild(container);
        updateMap();
      });
      container.appendChild(select);
      container.appendChild(removeBtn);
      waypointsDiv.appendChild(container);
    }
  
    function updateMap() {
      if (routeLayer) {
        map.removeLayer(routeLayer);
      }
      const startCity = document.getElementById('start').value;
      const endCity = document.getElementById('end').value;
      const waypointSelects = document.querySelectorAll('#waypoints select');
      const waypointCities = Array.from(waypointSelects)
        .filter(s => s.value)
        .map(s => s.value);
  
      const routeCities = [startCity, ...waypointCities, endCity].filter(city => city !== "");
  
      if (routeCities.length < 2) {
        return;
      }
  
      const routeCoordinates = routeCities.map(cityName => {
        const city = cities.find(c => c.city === cityName);
        return [city.lat, city.lon];
      });
  
      routeLayer = L.polyline(routeCoordinates, { color: 'blue' }).addTo(map);
      map.fitBounds(routeLayer.getBounds());
    }
  
    async function fetchDriverProfile() {
      try {
        const response = await fetch('/driver/profile');
        if (!response.ok) {
          throw new Error("Erreur lors du chargement du profil");
        }
        const userData = await response.json();
        driverProfile = userData.user;
        const profileInfo = document.getElementById('profileInfo');
        profileInfo.innerHTML = `
          <p><strong>Nom:</strong> ${driverProfile.first_name || 'N/A'}</p>
          <p><strong>Email:</strong> ${driverProfile.email || 'N/A'}</p>
        `;
        loadVehicle();
        loadAnnouncements();
      } catch (error) {
        console.error(error);
        document.getElementById('profileInfo').innerHTML = '<p class="text-red-500">Erreur lors du chargement du profil.</p>';
      }
    }
  
    async function loadVehicle() {
      try {
        const response = await fetch('/vehicles');
        const vehicles = await response.json();
        const vehicleInfo = document.getElementById('vehicleInfo');
        if (vehicles.length === 0) {
          vehicleInfo.innerHTML = '<p class="text-gray-500">Aucun véhicule trouvé.</p>';
          return;
        }
        const vehicle = vehicles[0];
        // Store vehicle ID in a global variable
        driverVehicleId = vehicle.vehicle_id;
        vehicleInfo.innerHTML = `
          <p><strong>Type de Véhicule:</strong> ${vehicle.vehicle_type}</p>
          <p><strong>Taille de Transport:</strong> ${vehicle.carry_size}</p>
        `;
      } catch (error) {
        console.error(error);
        document.getElementById('vehicleInfo').innerHTML = '<p class="text-red-500">Erreur lors du chargement du véhicule.</p>';
      }
    }
  
    async function createVehicle(event) {
      event.preventDefault();
      const vehicleType = document.getElementById('vehicle_type').value;
      const carrySize = document.getElementById('carry_size').value;
      try {
        const response = await fetch('/driver/createVehicle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vehicle_type: vehicleType, carry_size: carrySize })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Erreur lors de la création du véhicule");
        }
        alert("Véhicule créé avec succès !");
        document.getElementById('addVehicleModal').style.display = 'none';
        loadVehicle();
      } catch (error) {
        console.error(error);
        alert("Erreur lors de la création du véhicule : " + error.message);
      }
    }
  
    async function createAnnouncement() {
      const availableFrom = document.getElementById('availableFrom').value;
      const availableUntil = document.getElementById('availableUntil').value;
      // Use the globally stored driverVehicleId
      const vehicleId = driverVehicleId;
  
      const startCity = document.getElementById('start').value;
      const endCity = document.getElementById('end').value;
      const waypointSelects = document.querySelectorAll('#waypoints select');
      const waypointCities = Array.from(waypointSelects)
        .filter(s => s.value)
        .map(s => s.value);
  
      const routeCities = [startCity, ...waypointCities, endCity].filter(city => city !== "");
  
      if (!availableFrom || !availableUntil || routeCities.length < 2 || !vehicleId) {
        alert("Veuillez remplir tous les champs requis (y compris au moins deux villes et un véhicule existant).");
        return;
      }
  
      const announcementData = {
        driver_id: driverProfile.user_id,
        vehicle_id: vehicleId,
        available_from: availableFrom,
        available_until: availableUntil,
        cities: routeCities,
      };
  
      try {
        // Note: ensure the URL is correct (spelling of 'Announcement' matters)
        const response = await fetch('/driver/createAnnouncement', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(announcementData)
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Erreur lors de la création de l'annonce");
        }
        alert("Annonce créée avec succès !");
        loadAnnouncements();
      } catch (error) {
        console.error(error);
        alert("Erreur lors de la création de l'annonce : " + error.message);
      }
    }
  
    async function loadAnnouncements() {
      if (!driverProfile || !driverProfile.user_id) {
        alert("Profil conducteur non chargé.");
        return;
      }
      try {
        const response = await fetch('/driver/getAllAnnouncements', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driver_id: driverProfile.user_id })
        });
        const announcements = await response.json();
        renderAnnouncements(announcements);
      } catch (error) {
        console.error(error);
        alert("Erreur lors du chargement des annonces.");
      }
    }
  
    function renderAnnouncements(announcements) {
      const container = document.getElementById('announcementsList');
      container.innerHTML = '';
      if (!announcements || announcements.length === 0) {
        container.innerHTML = '<p class="text-gray-500">Aucune annonce trouvée.</p>';
        return;
      }
      announcements.forEach(ann => {
        const div = document.createElement('div');
        div.className = 'border-b border-gray-200 py-2';
        div.innerHTML = `
          <p><strong>ID:</strong> ${ann.id}</p>
          <p><strong>Disponible De:</strong> ${ann.available_from}</p>
          <p><strong>Disponible Jusqu'à:</strong> ${ann.available_until}</p>
          <p><strong>Véhicule Type:</strong> ${ann.vehicle_type}</p>
          <p><strong>Villes:</strong> ${ann.cities ? ann.cities.join(', ') : 'N/A'}</p>
            <button onclick="deleteAnnouncement(${ann.announcement_id})" 
             class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
        Supprimer
      </button>
        `;
        container.appendChild(div);
      });
    }
  
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadCities();
      fetchDriverProfile();
  
      document.getElementById('addWaypointBtn').addEventListener('click', addWaypoint);
      document.getElementById('createAnnouncementBtn').addEventListener('click', createAnnouncement);
      document.getElementById('addVehicleForm').addEventListener('submit', createVehicle);
      document.getElementById('cancelAddVehicle').addEventListener('click', () => {
        document.getElementById('addVehicleModal').style.display = 'none';
      });
      document.getElementById('addVehicleBtn').addEventListener('click', () => {
        document.getElementById('addVehicleModal').style.display = 'block';
      });

      loadDriverPackages();
    });


    async function loadDriverPackages() {
  try {
    const response = await fetch('/admin/getAllPackages', {
      method: 'GET',
      headers: {'Content-Type': 'application/json'}
    });
    
    const package_ = await response.json();
    const packages = package_.packages;
    renderPackages(packages);
  } catch (error) {
    console.error(error);
    alert("Erreur lors du chargement des colis");
  }
}

async function renderPackages(packages) {
  const tbody = document.getElementById('packagesTableBody');
  tbody.innerHTML = '';
  
  for (const pkg of packages) {
    
    const senderResponse = await fetch(`/user/getallsenders`);
    const users = await senderResponse.json();
    const sender = users.forEach(user => {
      if (user.user_id === pkg.sender_id) {
        return user;
      }
    });
    console.log(sender);
    
    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="px-4 py-2 text-center">${pkg.request_id}</td>
      <td class="px-4 py-2 text-center">${sender.first_name} ${sender.last_name}</td>
      <td class="px-4 py-2 text-center">${pkg.package_size} cm³</td>
      <td class="px-4 py-2 text-center">${pkg.pickup_city}</td>
      <td class="px-4 py-2 text-center">${pkg.dropoff_city}</td>
      <td class="px-4 py-2 text-center">
        <span class="px-2 py-1 rounded ${getStatusColor(pkg.status)}">${pkg.status}</span>
      </td>
      <td class="px-4 py-2 text-center">
        ${pkg.status === 'pending' ? 
          `<button onclick="updatePackageStatus(${pkg.request_id}, 'accepted')" 
           class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">
            Accepter
          </button>` : ''}
      </td>
    `;
    tbody.appendChild(row);
  }
}

function getStatusColor(status) {
  switch(status) {
    case 'pending': return 'bg-yellow-200';
    case 'accepted': return 'bg-blue-200';
    case 'in_transit': return 'bg-purple-200';
    case 'delivered': return 'bg-green-200';
    default: return 'bg-gray-200';
  }
}

// Add this to the deleteAnnouncement function
async function deleteAnnouncement(announcementId) {
  if (confirm("Êtes-vous sûr de vouloir supprimer cette annonce?")) {
    try {
      const response = await fetch('/driver/deleteAnnouncement', {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({announcement_id: announcementId})
      });
      
      if (response.ok) {
        loadAnnouncements();
        loadDriverPackages(); // Refresh packages list
        alert("Annonce supprimée avec succès!");
      }
    } catch (error) {
      console.error(error);
      alert("Erreur lors de la suppression");
    }
  }
}




  </script>
  
</body>
</html>
